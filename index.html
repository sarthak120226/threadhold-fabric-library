<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threadhold Fabric Library</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="window.__qrLibFailed=true"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#faf9f5;
    --surface:#ffffff;
    --surface-2:#f2f0ea;
    --surface-3:#eae7de;
    --border:#e1ddd1;
    --border-soft:#ece9df;
    --text-primary:#1c1b17;
    --text-secondary:#65635a;
    --text-muted:#98958a;
    --accent:#2c4a6e;
    --accent-strong:#1c3049;
    --accent-soft:#e7edf3;
    --accent-ink:#ffffff;
    --focus-ring:#2c4a6e;
    --good:#0ca30c;
    --warning:#a86400;
    --warning-bg:#fdf1da;
    --serious:#b3502c;
    --serious-bg:#fbe9e0;
    --cat-men:#2a6fc9;
    --cat-women:#5a3aa7;
    --cat-sport:#158f63;
    --cat-unisex:#c05a1f;
    --shadow-sm: 0 1px 2px rgba(28,27,23,.06);
    --shadow-md: 0 8px 24px rgba(28,27,23,.10);
    --shadow-lg: 0 16px 48px rgba(28,27,23,.18);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#141412;
      --surface:#1c1b18;
      --surface-2:#242320;
      --surface-3:#2c2a25;
      --border:#3a382f;
      --border-soft:#302e28;
      --text-primary:#f4f2ea;
      --text-secondary:#bcb9ac;
      --text-muted:#84806f;
      --accent:#6f9bcf;
      --accent-strong:#8fb2da;
      --accent-soft:#243347;
      --accent-ink:#0f1a26;
      --focus-ring:#8fb2da;
      --good:#3fc23f;
      --warning:#e0ac4c;
      --warning-bg:#3a2e13;
      --serious:#e58a63;
      --serious-bg:#3a2216;
      --cat-men:#5c9ae0;
      --cat-women:#9c86e0;
      --cat-sport:#3fbf93;
      --cat-unisex:#e08a4f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 8px 24px rgba(0,0,0,.45);
      --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#141412;
    --surface:#1c1b18;
    --surface-2:#242320;
    --surface-3:#2c2a25;
    --border:#3a382f;
    --border-soft:#302e28;
    --text-primary:#f4f2ea;
    --text-secondary:#bcb9ac;
    --text-muted:#84806f;
    --accent:#6f9bcf;
    --accent-strong:#8fb2da;
    --accent-soft:#243347;
    --accent-ink:#0f1a26;
    --focus-ring:#8fb2da;
    --good:#3fc23f;
    --warning:#e0ac4c;
    --warning-bg:#3a2e13;
    --serious:#e58a63;
    --serious-bg:#3a2216;
    --cat-men:#5c9ae0;
    --cat-women:#9c86e0;
    --cat-sport:#3fbf93;
    --cat-unisex:#e08a4f;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .wordmark{font-family:'Source Serif 4', Georgia, serif;}
  .app{min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:16px 28px;
    display:flex; align-items:center; gap:20px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex:0 0 auto;}
  .brand .mark{font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  .brand .sub{font-size:12px; color:var(--text-muted); border-left:1px solid var(--border); padding-left:10px; letter-spacing:.02em;}
  .topbar-spacer{flex:1 1 auto;}
  .topbar-actions{display:flex; gap:10px; flex:0 0 auto;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 14px; border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-primary);
    font-size:13px; font-weight:600;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2); border-color:var(--text-muted);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .icon{width:15px; height:15px; flex:0 0 auto;}

  .layout{display:flex; flex:1; align-items:flex-start;}
  .filters{
    width:264px; flex:0 0 264px;
    position:sticky; top:65px;
    max-height:calc(100vh - 65px);
    overflow-y:auto;
    padding:22px 20px 40px;
    border-right:1px solid var(--border);
  }
  .filter-block{margin-bottom:24px;}
  .filter-title{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); margin-bottom:10px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:9px 12px;
  }
  .search-box input{
    border:none; background:transparent; outline:none; width:100%;
    font-size:13px; color:var(--text-primary); font-family:inherit;
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box svg{flex:0 0 auto; color:var(--text-muted);}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-secondary);
    font-size:12px; font-weight:600;
    padding:6px 11px; border-radius:100px;
    cursor:pointer; user-select:none;
    transition:all .12s ease;
  }
  .chip:hover{border-color:var(--text-muted);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .range-row{display:flex; align-items:center; gap:8px;}
  .range-row input[type=number]{
    width:100%; padding:7px 9px; border:1px solid var(--border);
    border-radius:6px; background:var(--surface); color:var(--text-primary);
    font-family:inherit; font-size:12px; font-variant-numeric:tabular-nums;
  }
  .range-row span{color:var(--text-muted); font-size:12px;}
  select.select{
    width:100%; padding:8px 10px; border:1px solid var(--border);
    border-radius:6px; background:var(--surface); color:var(--text-primary);
    font-family:inherit; font-size:13px;
  }
  .reset-link{
    background:none; border:none; color:var(--accent); font-size:12px; font-weight:600;
    cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px;
  }

  .catalog{flex:1 1 auto; min-width:0; padding:22px 28px 60px;}
  .catalog-head{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .result-count{font-size:13px; color:var(--text-secondary);}
  .result-count strong{color:var(--text-primary); font-variant-numeric:tabular-nums;}
  .head-controls{display:flex; gap:10px; align-items:center;}
  .head-controls select{width:auto; min-width:150px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; cursor:pointer; text-align:left;
    display:flex; flex-direction:column;
    transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease;
    padding:0;
  }
  .card:hover{box-shadow:var(--shadow-md); border-color:var(--text-muted); transform:translateY(-1px);}
  .swatch-wrap{position:relative; height:132px; background:var(--surface-2);}
  .swatch-wrap svg{width:100%; height:100%; display:block;}
  .swatch-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
  .status-pill{
    position:absolute; top:9px; right:9px; z-index:1;
    font-size:10.5px; font-weight:700; letter-spacing:.02em;
    padding:4px 8px; border-radius:100px;
    display:flex; align-items:center; gap:4px;
    box-shadow:var(--shadow-sm);
  }
  .status-pill .dot{width:6px; height:6px; border-radius:50%;}
  .status-instock{background:#e6f6e6; color:#0b6b0b;}
  .status-limited{background:var(--warning-bg); color:var(--warning);}
  .status-madetoorder{background:var(--serious-bg); color:var(--serious);}
  :root:not([data-theme="light"]) .status-instock, :root[data-theme="dark"] .status-instock{background:#123a12; color:#79e079;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .status-instock{background:#123a12; color:#79e079;} }

  .card-body{padding:13px 14px 15px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .fabric-code{font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .cat-chip{font-size:10px; font-weight:700; padding:2px 7px; border-radius:100px; white-space:nowrap;}
  .cat-men{background:color-mix(in srgb, var(--cat-men) 14%, transparent); color:var(--cat-men);}
  .cat-women{background:color-mix(in srgb, var(--cat-women) 14%, transparent); color:var(--cat-women);}
  .cat-sportswear{background:color-mix(in srgb, var(--cat-sport) 14%, transparent); color:var(--cat-sport);}
  .cat-unisex{background:color-mix(in srgb, var(--cat-unisex) 14%, transparent); color:var(--cat-unisex);}

  .fabric-comp{font-size:13.5px; font-weight:600; color:var(--text-primary); line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .fabric-stats{display:flex; gap:12px; margin-top:4px; font-size:11.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .fabric-stats b{color:var(--text-secondary); font-weight:600;}

  .empty-state{text-align:center; padding:70px 20px; color:var(--text-secondary);}
  .empty-state svg{margin-bottom:12px; color:var(--text-muted);}

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(20,20,17,.45);
    opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:40;
  }
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(440px, 100vw);
    background:var(--surface); border-left:1px solid var(--border);
    box-shadow:var(--shadow-lg);
    transform:translateX(100%); transition:transform .22s ease;
    z-index:50; overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-swatch{height:180px; position:relative;}
  .drawer-swatch svg{width:100%; height:100%; display:block;}
  .drawer-close{
    position:absolute; top:12px; right:12px; z-index:1;
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,.9); color:#1c1b17;
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  .drawer-content{padding:20px 22px 32px;}
  .drawer-eyebrow{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .drawer-title{font-size:19px; font-weight:700; margin-bottom:2px;}
  .drawer-code{font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; letter-spacing:.02em;}
  .drawer-actions{display:flex; gap:8px; margin:16px 0 6px; flex-wrap:wrap;}

  .spec-section{margin-top:22px;}
  .spec-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:10px; padding-top:14px; border-top:1px solid var(--border-soft);}
  .spec-section:first-of-type .spec-title{border-top:none; padding-top:0;}
  .spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .spec-item{display:flex; flex-direction:column; gap:2px;}
  .spec-label{font-size:11px; color:var(--text-muted);}
  .spec-value{font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums;}
  .spec-value.muted{color:var(--text-muted); font-weight:500; font-style:italic;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,20,17,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:26px; width:min(320px,100%); box-shadow:var(--shadow-lg); text-align:center;}
  .modal h3{font-size:16px; margin-bottom:4px;}
  .modal p{font-size:12.5px; color:var(--text-secondary); margin:0 0 16px;}
  #qrcode{display:flex; align-items:center; justify-content:center; margin:0 auto 16px; padding:12px; background:#fff; border-radius:10px; width:184px; height:184px;}
  #qrcode img, #qrcode canvas{width:160px !important; height:160px !important;}
  .link-row{display:flex; gap:6px; margin-bottom:14px;}
  .link-row input{flex:1; min-width:0; padding:7px 9px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); color:var(--text-secondary); font-size:11px; font-family:inherit;}
  .modal-actions{display:flex; gap:8px; justify-content:center;}
  .modal-close-x{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px;}

  .site-footer{padding:18px 28px; text-align:center; font-size:11.5px; color:var(--text-muted); border-top:1px solid var(--border);}

  @media (max-width: 880px){
    .filters{position:static; width:100%; flex:1 1 100%; max-height:none; border-right:none; border-bottom:1px solid var(--border);}
    .layout{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="wordmark mark">Threadhold</span>
      <span class="sub">Fabric Library</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn" id="shareBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM14 20h3M20 14v3M17 20h3v-3"/></svg>
        Share &amp; QR
      </button>
      <button class="btn btn-primary" id="exportBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="filters">
      <div class="filter-block">
        <div class="filter-title">Search</div>
        <label class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Try &quot;cotton&quot;, &quot;20% elastane&quot;, TH-CT-1042...">
        </label>
      </div>
      <div class="filter-block">
        <div class="filter-title">Category</div>
        <div class="chip-row" id="categoryChips"></div>
      </div>
      <div class="filter-block">
        <div class="filter-title">Fiber content</div>
        <div class="chip-row" id="fiberChips"></div>
      </div>
      <div class="filter-block">
        <div class="filter-title">Availability</div>
        <div class="chip-row" id="statusChips"></div>
      </div>
      <div class="filter-block">
        <div class="filter-title">GSM range</div>
        <div class="range-row">
          <input type="number" id="gsmMin" placeholder="Min" min="0">
          <span>&ndash;</span>
          <input type="number" id="gsmMax" placeholder="Max" min="0">
        </div>
      </div>
      <button class="reset-link" id="resetBtn" type="button">Reset all filters</button>
    </aside>

    <main class="catalog">
      <div class="catalog-head">
        <div class="result-count" id="resultCount">Loading fabric library&hellip;</div>
        <div class="head-controls">
          <select class="select" id="sortSelect">
            <option value="code">Sort: Fabric code (A&ndash;Z)</option>
            <option value="gsm-asc">Sort: GSM (low&ndash;high)</option>
            <option value="gsm-desc">Sort: GSM (high&ndash;low)</option>
          </select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState" hidden></div>
    </main>
  </div>

  <div class="site-footer">Threadhold &middot; global fabric sourcing &middot; data synced from Airtable</div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal-backdrop" id="qrBackdrop">
  <div class="modal" style="position:relative;">
    <button class="modal-close-x" id="qrClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3>Scan to open</h3>
    <p>Point a phone camera at this code to pull up the live fabric library.</p>
    <div id="qrcode"></div>
    <div class="link-row">
      <input type="text" id="shareLink" readonly>
      <button class="btn btn-sm" id="copyLinkBtn" type="button">Copy</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" id="saveQrBtn" type="button">Save QR image</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------
     DATA — loaded live from /api/fabrics (which reads your Airtable
     base). Nothing is hardcoded here anymore.
  --------------------------------------------------------------- */
  var FABRICS = [];

  var CONTACT_EMAIL = "hello@threadhold.co"; // update to your real sourcing inbox

  // No colorway/weave fields exist in Airtable, so swatch color and pattern
  // are generated deterministically from the fabric code + composition —
  // this keeps each card visually distinct and stable without requiring
  // you to enter that data.
  var BUCKETS = ["diagonal","cross","knit","rib","sheer","mesh"];

  /* ---------------- small helpers ---------------- */
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function dispNum(v, suffix){
    if(v===null || v===undefined || v==="") return "—";
    var n = Number(v);
    if(isNaN(n)) return escapeHtml(v) + (suffix||"");
    return n.toLocaleString() + (suffix||"");
  }
  function hashStr(s){
    var h = 0;
    s = String(s||"");
    for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function hslToHex(h, s, l){
    s/=100; l/=100;
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r=0,g=0,b=0;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    var toHex = function(v){ var n = Math.round((v+m)*255); return n.toString(16).padStart(2,"0"); };
    return "#"+toHex(r)+toHex(g)+toHex(b);
  }
  function colorForFabric(f){
    var seed = f.composition || f.id || "fabric";
    return hslToHex(hashStr(seed) % 360, 26, 52);
  }
  function bucketForFabric(f){
    var seed = (f.id || "") + "|" + (f.composition || "fabric");
    return BUCKETS[hashStr(seed) % BUCKETS.length];
  }
  function shade(hex, amt){
    var c = hex.replace('#','');
    var num = parseInt(c,16);
    var r = Math.min(255, Math.max(0, (num>>16) + amt));
    var g = Math.min(255, Math.max(0, ((num>>8)&0xff) + amt));
    var b = Math.min(255, Math.max(0, (num&0xff) + amt));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  function buildSwatchSvg(fabric, uid){
    var base = colorForFabric(fabric);
    var light = shade(base, 28);
    var dark = shade(base, -28);
    var bucket = bucketForFabric(fabric);
    var pid = "p"+uid;
    var defs = "";

    if(bucket === "diagonal"){
      defs = '<pattern id="'+pid+'" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
             '<rect width="10" height="10" fill="'+base+'"/>' +
             '<line x1="0" y1="0" x2="0" y2="10" stroke="'+dark+'" stroke-width="3.5" opacity="0.55"/>' +
             '</pattern>';
    } else if(bucket === "cross"){
      defs = '<pattern id="'+pid+'" width="9" height="9" patternUnits="userSpaceOnUse">' +
             '<rect width="9" height="9" fill="'+base+'"/>' +
             '<line x1="0" y1="0" x2="9" y2="0" stroke="'+dark+'" stroke-width="1" opacity="0.4"/>' +
             '<line x1="0" y1="0" x2="0" y2="9" stroke="'+dark+'" stroke-width="1" opacity="0.4"/>' +
             '</pattern>';
    } else if(bucket === "knit"){
      defs = '<pattern id="'+pid+'" width="8" height="6" patternUnits="userSpaceOnUse">' +
             '<rect width="8" height="6" fill="'+base+'"/>' +
             '<path d="M0 3 Q2 0 4 3 T8 3" stroke="'+light+'" stroke-width="1.1" fill="none" opacity="0.55"/>' +
             '<path d="M0 6 Q2 3 4 6 T8 6" stroke="'+dark+'" stroke-width="1.1" fill="none" opacity="0.35"/>' +
             '</pattern>';
    } else if(bucket === "rib"){
      defs = '<pattern id="'+pid+'" width="7" height="4" patternUnits="userSpaceOnUse">' +
             '<rect width="7" height="4" fill="'+base+'"/>' +
             '<rect x="0" width="3.4" height="4" fill="'+light+'" opacity="0.4"/>' +
             '</pattern>';
    } else if(bucket === "sheer"){
      defs = '<pattern id="'+pid+'" width="14" height="14" patternTransform="rotate(20)" patternUnits="userSpaceOnUse">' +
             '<rect width="14" height="14" fill="'+base+'"/>' +
             '<line x1="0" y1="0" x2="0" y2="14" stroke="'+light+'" stroke-width="1" opacity="0.5"/>' +
             '</pattern>';
    } else if(bucket === "mesh"){
      defs = '<pattern id="'+pid+'" width="10" height="10" patternUnits="userSpaceOnUse">' +
             '<rect width="10" height="10" fill="'+base+'"/>' +
             '<circle cx="5" cy="5" r="2.6" fill="'+dark+'" opacity="0.32"/>' +
             '</pattern>';
    }

    return '<svg viewBox="0 0 200 132" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
           '<defs>'+defs+'</defs>' +
           '<rect width="200" height="132" fill="url(#'+pid+')"/>' +
           '<rect width="200" height="132" fill="black" opacity="0.03"/>' +
           '</svg>';
  }

  function swatchLayer(f, uid){
    var svg = buildSwatchSvg(f, uid);
    if(f.photoUrl){
      return svg + '<img class="swatch-img" src="'+escapeHtml(f.photoUrl)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    }
    return svg;
  }

  /* ---------------- status / category helpers ---------------- */
  function statusInfo(status){
    if(status === "In-Stock") return {cls:"status-instock", dot:"#0ca30c", label:"In Stock"};
    if(status === "Limited") return {cls:"status-limited", dot:"var(--warning)", label:"Limited Stock"};
    return {cls:"status-madetoorder", dot:"var(--serious)", label:"Made to Order"};
  }
  function catClass(cat){
    var map = {"menswear":"cat-men","womenswear":"cat-women","sportswear":"cat-sportswear"};
    var c = (cat||"").toLowerCase();
    return map[c] || "cat-unisex";
  }

  /* ---------------- filter state ---------------- */
  var state = { q:"", category:"All", fibers:[], status:"All", gsmMin:null, gsmMax:null, sort:"code" };
  var FIBER_LIST = ["Cotton","Polyester","Nylon","Viscose","Elastane / Spandex","Wool","Linen","Modal","TENCEL","Recycled Polyester"];
  var CATEGORY_LIST = ["All","Menswear","Womenswear","Sportswear"];
  var STATUS_LIST = ["All","In-Stock","Limited","Made to Order"];

  function matchesFiber(comp, fiber){
    var c = (comp||"").toLowerCase();
    if(fiber === "Elastane / Spandex") return c.indexOf("elastane") > -1 || c.indexOf("spandex") > -1;
    return c.indexOf(fiber.toLowerCase()) > -1;
  }
  function searchableString(f){
    return [f.id, f.composition, f.category].join(" ").toLowerCase();
  }
  function applyFilters(){
    var q = state.q.trim().toLowerCase();
    var out = FABRICS.filter(function(f){
      if(q && searchableString(f).indexOf(q) === -1) return false;
      if(state.category !== "All" && f.category !== state.category) return false;
      if(state.status !== "All" && f.status !== state.status) return false;
      if(state.fibers.length && !state.fibers.some(function(fb){ return matchesFiber(f.composition, fb); })) return false;
      var gsm = Number(f.gsm);
      if(state.gsmMin !== null && (isNaN(gsm) || gsm < state.gsmMin)) return false;
      if(state.gsmMax !== null && (isNaN(gsm) || gsm > state.gsmMax)) return false;
      return true;
    });
    out.sort(function(a,b){
      switch(state.sort){
        case "gsm-asc": return (Number(a.gsm)||0) - (Number(b.gsm)||0);
        case "gsm-desc": return (Number(b.gsm)||0) - (Number(a.gsm)||0);
        default: return (a.id||"").localeCompare(b.id||"");
      }
    });
    return out;
  }

  /* ---------------- rendering ---------------- */
  var grid = document.getElementById("grid");
  var emptyState = document.getElementById("emptyState");
  var resultCount = document.getElementById("resultCount");

  function cardHtml(f, idx){
    var s = statusInfo(f.status);
    var pilling = f.pilling ? "Grade " + escapeHtml(f.pilling) : "—";
    return (
      '<button class="card" data-id="'+escapeHtml(f.id)+'" type="button">' +
        '<div class="swatch-wrap">' + swatchLayer(f, idx) +
          '<span class="status-pill '+s.cls+'"><span class="dot" style="background:'+s.dot+'"></span>'+s.label+'</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<span class="fabric-code">'+escapeHtml(f.id)+'</span>' +
            '<span class="cat-chip '+catClass(f.category)+'">'+escapeHtml(f.category)+'</span>' +
          '</div>' +
          '<div class="fabric-comp">'+escapeHtml(f.composition)+'</div>' +
          '<div class="fabric-stats"><span><b>'+dispNum(f.gsm)+'</b> GSM</span><span><b>'+dispNum(f.width)+'cm</b> width</span><span>Pilling '+pilling+'</span></div>' +
        '</div>' +
      '</button>'
    );
  }

  function renderLoading(){
    grid.innerHTML = "";
    resultCount.textContent = "Loading fabric library…";
    emptyState.hidden = true;
  }
  function renderError(){
    grid.innerHTML = "";
    resultCount.textContent = "";
    emptyState.hidden = false;
    emptyState.innerHTML =
      '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      '<div>Couldn&rsquo;t load the live catalog right now. Please refresh, or check back in a few minutes.</div>';
  }

  function render(){
    var results = applyFilters();
    resultCount.innerHTML = 'Showing <strong>'+results.length+'</strong> of '+FABRICS.length+' fabrics';
    if(results.length === 0){
      grid.innerHTML = "";
      emptyState.hidden = false;
      emptyState.innerHTML =
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<div>No fabrics match these filters.</div>';
    } else {
      emptyState.hidden = true;
      grid.innerHTML = results.map(cardHtml).join("");
    }
    Array.prototype.forEach.call(grid.querySelectorAll(".card"), function(card){
      card.addEventListener("click", function(){ openDrawer(card.getAttribute("data-id")); });
    });
  }

  /* ---------------- filter UI wiring ---------------- */
  function buildChips(container, list, key, multi){
    container.innerHTML = list.map(function(v){
      return '<button class="chip" data-v="'+escapeHtml(v)+'" type="button">'+escapeHtml(v)+'</button>';
    }).join("");
    Array.prototype.forEach.call(container.children, function(chip){
      chip.addEventListener("click", function(){
        var v = chip.getAttribute("data-v");
        if(multi){
          var i = state[key].indexOf(v);
          if(i > -1) state[key].splice(i,1); else state[key].push(v);
          chip.classList.toggle("active");
        } else {
          state[key] = v;
          Array.prototype.forEach.call(container.children, function(c){ c.classList.remove("active"); });
          chip.classList.add("active");
        }
        render();
      });
    });
    if(container.children[0] && !multi) container.children[0].classList.add("active");
  }

  buildChips(document.getElementById("categoryChips"), CATEGORY_LIST, "category", false);
  buildChips(document.getElementById("fiberChips"), FIBER_LIST, "fibers", true);
  buildChips(document.getElementById("statusChips"), STATUS_LIST, "status", false);

  document.getElementById("searchInput").addEventListener("input", function(e){ state.q = e.target.value; render(); });
  document.getElementById("gsmMin").addEventListener("input", function(e){ state.gsmMin = e.target.value === "" ? null : Number(e.target.value); render(); });
  document.getElementById("gsmMax").addEventListener("input", function(e){ state.gsmMax = e.target.value === "" ? null : Number(e.target.value); render(); });
  document.getElementById("sortSelect").addEventListener("change", function(e){ state.sort = e.target.value; render(); });
  document.getElementById("resetBtn").addEventListener("click", function(){
    state = {q:"", category:"All", fibers:[], status:"All", gsmMin:null, gsmMax:null, sort:"code"};
    document.getElementById("searchInput").value = "";
    document.getElementById("gsmMin").value = "";
    document.getElementById("gsmMax").value = "";
    document.getElementById("sortSelect").value = "code";
    buildChips(document.getElementById("categoryChips"), CATEGORY_LIST, "category", false);
    buildChips(document.getElementById("fiberChips"), FIBER_LIST, "fibers", true);
    buildChips(document.getElementById("statusChips"), STATUS_LIST, "status", false);
    render();
  });

  /* ---------------- drawer ---------------- */
  var drawer = document.getElementById("drawer");
  var drawerBackdrop = document.getElementById("drawerBackdrop");

  function specItem(label, value, muted){
    return '<div class="spec-item"><span class="spec-label">'+label+'</span><span class="spec-value'+(muted?' muted':'')+'">'+value+'</span></div>';
  }

  function openDrawer(id){
    var f = FABRICS.filter(function(x){return x.id === id;})[0];
    if(!f) return;
    var s = statusInfo(f.status);

    drawer.innerHTML =
      '<div class="drawer-swatch">'+swatchLayer(f, "drawer")+
        '<button class="drawer-close" id="drawerCloseBtn" aria-label="Close">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="drawer-content">' +
        '<div class="drawer-eyebrow">' +
          '<span class="status-pill '+s.cls+'"><span class="dot" style="background:'+s.dot+'"></span>'+s.label+'</span>' +
          '<span class="cat-chip '+catClass(f.category)+'">'+escapeHtml(f.category)+'</span>' +
        '</div>' +
        '<div class="drawer-title">'+escapeHtml(f.id)+'</div>' +
        '<div class="drawer-code">'+escapeHtml(f.composition)+'</div>' +
        '<div class="drawer-actions">' +
          '<a class="btn btn-sm btn-primary" href="mailto:'+CONTACT_EMAIL+'?subject=Sample%20request%20-%20'+encodeURIComponent(f.id)+'&body=Hi%20Threadhold%2C%0A%0APlease%20send%20a%20sample%20of%20'+encodeURIComponent(f.id)+'.%0A%0AThanks">Request sample</a>' +
          '<button class="btn btn-sm" id="downloadSpecBtn" type="button">Download spec sheet</button>' +
          '<button class="btn btn-sm" id="copyCodeBtn" type="button">Copy code</button>' +
        '</div>' +

        '<div class="spec-section">' +
          '<div class="spec-title">Fabric specification</div>' +
          '<div class="spec-grid">' +
            specItem("Composition", escapeHtml(f.composition) || "—") +
            specItem("GSM", dispNum(f.gsm)) +
            specItem("Width", dispNum(f.width, " cm")) +
            specItem("Shrinkage", f.shrinkage ? escapeHtml(f.shrinkage) : "Not recorded", !f.shrinkage) +
            specItem("Pilling grade", f.pilling ? escapeHtml(f.pilling) + " / 5 (ISO 12945-2)" : "Not tested yet", !f.pilling) +
            specItem("Color fastness", f.colorFastness ? escapeHtml(f.colorFastness) + " / 5" : "Not tested yet", !f.colorFastness) +
          '</div>' +
        '</div>' +

        '<div class="spec-section">' +
          '<div class="spec-title">Sourcing details</div>' +
          '<div class="spec-grid">' +
            specItem("MOQ", f.moq ? escapeHtml(f.moq) : "Contact us", !f.moq) +
          '</div>' +
        '</div>' +
      '</div>';

    drawer.classList.add("open");
    drawerBackdrop.classList.add("open");

    document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
    document.getElementById("copyCodeBtn").addEventListener("click", function(){
      navigator.clipboard && navigator.clipboard.writeText(f.id).catch(function(){});
      var btn = document.getElementById("copyCodeBtn");
      var orig = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){btn.textContent = orig;}, 1400);
    });
    document.getElementById("downloadSpecBtn").addEventListener("click", function(){ downloadSpecSheet(f); });
  }

  function closeDrawer(){
    drawer.classList.remove("open");
    drawerBackdrop.classList.remove("open");
  }
  drawerBackdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closeDrawer(); } });

  /* ---------------- downloads (plain browser download — no Claude runtime here) ---------------- */
  function saveFile(filename, data, mime){
    var blob = data instanceof Blob ? data : new Blob([data], {type:mime});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }

  function csvEscape(v){
    v = String(v == null ? "" : v);
    if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
    return v;
  }
  function exportCsv(){
    var rows = applyFilters();
    var headers = ["Fabric Code","Category","Composition","GSM","Width (cm)","Shrinkage","Pilling Grade","Color Fastness","MOQ","Status"];
    var lines = [headers.join(",")];
    rows.forEach(function(f){
      lines.push([f.id,f.category,f.composition,f.gsm,f.width,f.shrinkage,f.pilling||"",f.colorFastness||"",f.moq,f.status].map(csvEscape).join(","));
    });
    saveFile("threadhold-fabric-library.csv", lines.join("\r\n"), "text/csv");
  }
  document.getElementById("exportBtn").addEventListener("click", exportCsv);

  function downloadSpecSheet(f){
    var lines = [
      "THREADHOLD — FABRIC SPEC SHEET", "================================", "",
      "Fabric code: " + f.id, "Category: " + f.category, "",
      "Composition: " + f.composition, "GSM: " + dispNum(f.gsm), "Width: " + dispNum(f.width, " cm"),
      "Shrinkage: " + (f.shrinkage || "Not recorded"),
      "Pilling grade: " + (f.pilling ? f.pilling + " / 5 (ISO 12945-2)" : "Not tested yet"),
      "Color fastness: " + (f.colorFastness ? f.colorFastness + " / 5" : "Not tested yet"), "",
      "MOQ: " + (f.moq || "Contact us"),
      "Status: " + f.status, "", "threadhold.co"
    ];
    saveFile(f.id + "-spec-sheet.txt", lines.join("\n"), "text/plain");
  }

  /* ---------------- QR / share modal ---------------- */
  var qrBackdrop = document.getElementById("qrBackdrop");
  var shareLinkInput = document.getElementById("shareLink");
  var qrRendered = false;
  function pageUrl(){ return window.location.origin + window.location.pathname; }

  function openShare(){
    var url = pageUrl();
    shareLinkInput.value = url;
    qrBackdrop.classList.add("open");
    if(!qrRendered){
      qrRendered = true;
      try{
        if(typeof QRCode !== "undefined"){
          new QRCode(document.getElementById("qrcode"), {
            text: url, width: 160, height: 160,
            colorDark: "#1c1b17", colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        } else {
          document.getElementById("qrcode").innerHTML = '<div style="font-size:11px;color:#65635a;padding:8px;">QR code unavailable here — use the link below.</div>';
        }
      } catch(err){
        document.getElementById("qrcode").innerHTML = '<div style="font-size:11px;color:#65635a;padding:8px;">QR code unavailable here — use the link below.</div>';
      }
    }
  }
  document.getElementById("shareBtn").addEventListener("click", openShare);
  document.getElementById("qrClose").addEventListener("click", function(){ qrBackdrop.classList.remove("open"); });
  qrBackdrop.addEventListener("click", function(e){ if(e.target === qrBackdrop) qrBackdrop.classList.remove("open"); });
  document.getElementById("copyLinkBtn").addEventListener("click", function(){
    navigator.clipboard && navigator.clipboard.writeText(shareLinkInput.value).catch(function(){});
    var btn = document.getElementById("copyLinkBtn");
    var orig = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){btn.textContent = orig;}, 1400);
  });
  document.getElementById("saveQrBtn").addEventListener("click", function(){
    var container = document.getElementById("qrcode");
    var canvas = container.querySelector("canvas");
    var img = container.querySelector("img");
    if(canvas){
      canvas.toBlob(function(blob){ if(blob) saveFile("threadhold-qr.png", blob); });
    } else if(img && img.src){
      fetch(img.src).then(function(r){return r.blob();}).then(function(blob){ saveFile("threadhold-qr.png", blob); }).catch(function(){});
    }
  });

  /* ---------------- load live data ---------------- */
  function loadFabrics(){
    renderLoading();
    fetch("/api/fabrics", {cache:"no-store"})
      .then(function(res){
        if(!res.ok) throw new Error("bad status " + res.status);
        return res.json();
      })
      .then(function(data){
        FABRICS = Array.isArray(data.fabrics) ? data.fabrics : (Array.isArray(data) ? data : []);
        render();
      })
      .catch(function(err){
        console.error("Failed to load fabrics", err);
        renderError();
      });
  }

  loadFabrics();
})();
</script>
</body>
</html>
